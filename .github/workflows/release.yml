name: Release

# Tag push → downloadable zip on GitHub Releases.
#   git tag v0.1.0 && git push origin v0.1.0
# Builds are ad-hoc signed. First open: Right-click → Open.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish zip
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block secret files in git
        run: chmod +x scripts/check-no-secrets.sh && ./scripts/check-no-secrets.sh

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Build release app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh "$GITHUB_WORKSPACE/build/Refraem.app"

      - name: Zip for download
        id: zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="build/Refraem-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Refraem.app "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Refraem ${{ steps.zip.outputs.version }}
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
